<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="case-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="branch1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="branch2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="branch3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="else-branch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#case-bg)" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <text x="500" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">
    🌳 CASE WHEN: SEQUENTIAL SHORT-CIRCUIT EVALUATION ENGINE
  </text>
  <text x="500" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    SQL tests conditions top-to-bottom. The moment a condition evaluates to TRUE, it exits immediately!
  </text>

  <!-- Flow Visualizer -->
  <!-- Top Node: Incoming Row -->
  <g transform="translate(360, 95)" filter="url(#shadow)">
    <rect width="280" height="40" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <text x="140" y="25" font-family="monospace" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">
      Input Row: (credit_score = 780)
    </text>
  </g>

  <!-- Flow Arrow Down -->
  <path d="M 500 135 L 500 160" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="500,160 495,152 505,152" fill="#6366f1" />

  <!-- Condition 1: >= 800 -->
  <g transform="translate(260, 160)" filter="url(#shadow)">
    <rect width="480" height="58" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="30" y="34" font-family="monospace" font-size="13" font-weight="bold" fill="#f472b6">WHEN credit_score &gt;= 800</text>
    <text x="340" y="25" font-family="sans-serif" font-size="11" fill="#94a3b8">780 &gt;= 800 ?</text>
    <rect x="340" y="30" width="110" height="20" rx="4" fill="#ef4444" opacity="0.2" />
    <text x="395" y="44" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">FALSE ❌ (Pass)</text>
  </g>

  <!-- Flow Arrow Down -->
  <path d="M 500 218 L 500 242" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="500,242 495,234 505,234" fill="#94a3b8" />

  <!-- Condition 2: >= 750 -->
  <g transform="translate(260, 242)" filter="url(#shadow)">
    <rect width="480" height="65" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="30" y="38" font-family="monospace" font-size="14" font-weight="bold" fill="#a7f3d0">WHEN credit_score &gt;= 750</text>
    <text x="340" y="28" font-family="sans-serif" font-size="11" fill="#6ee7b7">780 &gt;= 750 ?</text>
    <rect x="340" y="34" width="110" height="22" rx="4" fill="#10b981" />
    <text x="395" y="49" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">TRUE ✅ (MATCH!)</text>
  </g>

  <!-- Short-Circuit Output Box to the Right -->
  <path d="M 740 274 L 800 274" stroke="#10b981" stroke-width="3" />
  <polygon points="800,274 790,268 790,280" fill="#10b981" />

  <g transform="translate(805, 245)" filter="url(#shadow)">
    <rect width="145" height="58" rx="8" fill="url(#branch3)" stroke="#34d399" stroke-width="1.5" />
    <text x="72" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d1fae5" text-anchor="middle">OUTPUT RESULT:</text>
    <text x="72" y="44" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">'Prime Tier'</text>
  </g>

  <!-- Skipped Steps Marker (Faded) -->
  <g transform="translate(260, 335)" opacity="0.45">
    <rect width="480" height="45" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="30" y="28" font-family="monospace" font-size="12" fill="#94a3b8">WHEN credit_score &gt;= 650 THEN 'Near Prime'</text>
    <text x="380" y="28" font-family="sans-serif" font-size="11" fill="#f87171">[SKIPPED]</text>
  </g>

  <g transform="translate(260, 390)" opacity="0.45">
    <rect width="480" height="45" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="30" y="28" font-family="monospace" font-size="12" fill="#94a3b8">ELSE 'Subprime'</text>
    <text x="380" y="28" font-family="sans-serif" font-size="11" fill="#f87171">[SKIPPED]</text>
  </g>

  <!-- Bottom Insight Bar -->
  <rect x="60" y="450" width="880" height="50" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <text x="80" y="480" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">⚡ THE SHORT-CIRCUIT PRINCIPLE:</text>
  <text x="320" y="480" font-family="sans-serif" font-size="13" fill="#cbd5e1">
    SQL <tspan fill="#34d399" font-weight="bold">never evaluates later conditions</tspan> once an earlier condition succeeds. Order your rules intentionally!
  </text>
</svg>
