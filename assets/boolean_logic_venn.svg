<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bool-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1000" height="450" rx="16" fill="url(#bool-bg)" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <text x="500" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">
    🔀 BOOLEAN ALGEBRA &amp; LOGICAL OPERATORS IN SQL
  </text>
  <text x="500" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Visualizing Truth Sets for AND (Intersection), OR (Union), and NOT (Inversion)
  </text>

  <!-- Panel 1: AND -->
  <g transform="translate(60, 100)">
    <rect width="270" height="235" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="270" height="36" rx="12" fill="#2563eb" />
    <text x="135" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">A AND B (INTERSECTION)</text>
    
    <!-- Venn Diagram AND -->
    <circle cx="105" cy="115" r="45" fill="#334155" opacity="0.6" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="165" cy="115" r="45" fill="#334155" opacity="0.6" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Overlap intersection highlight -->
    <path d="M 135 79 A 45 45 0 0 1 135 151 A 45 45 0 0 1 135 79 Z" fill="#3b82f6" opacity="0.9" />
    
    <text x="80" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">A</text>
    <text x="190" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">B</text>
    
    <text x="135" y="185" font-family="monospace" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">WHERE cond1 AND cond2</text>
    <text x="135" y="210" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Both conditions MUST be True</text>
  </g>

  <!-- Panel 2: OR -->
  <g transform="translate(365, 100)">
    <rect width="270" height="235" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="270" height="36" rx="12" fill="#059669" />
    <text x="135" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">A OR B (UNION)</text>
    
    <!-- Venn Diagram OR -->
    <circle cx="105" cy="115" r="45" fill="#10b981" opacity="0.7" stroke="#34d399" stroke-width="1.5" />
    <circle cx="165" cy="115" r="45" fill="#10b981" opacity="0.7" stroke="#34d399" stroke-width="1.5" />
    
    <text x="80" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">A</text>
    <text x="190" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">B</text>
    
    <text x="135" y="185" font-family="monospace" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">WHERE cond1 OR cond2</text>
    <text x="135" y="210" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">At least ONE condition is True</text>
  </g>

  <!-- Panel 3: NOT -->
  <g transform="translate(670, 100)">
    <rect width="270" height="235" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <rect width="270" height="36" rx="12" fill="#dc2626" />
    <text x="135" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">NOT A (INVERSION)</text>
    
    <!-- Venn Diagram NOT -->
    <rect x="55" y="65" width="160" height="100" rx="8" fill="#ef4444" opacity="0.3" stroke="#f87171" stroke-width="1.5" />
    <circle cx="135" cy="115" r="40" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
    
    <text x="135" y="119" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">Excluded A</text>
    
    <text x="135" y="185" font-family="monospace" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">WHERE NOT (cond)</text>
    <text x="135" y="210" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Inverts truth value to False</text>
  </g>

  <!-- Bottom Tip -->
  <rect x="60" y="360" width="880" height="55" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <text x="80" y="393" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">⚖️ PRECEDENCE RULE:</text>
  <text x="255" y="393" font-family="sans-serif" font-size="13" fill="#cbd5e1">
    In SQL, <tspan fill="#60a5fa" font-weight="bold">AND has higher priority than OR</tspan>. Always use parentheses <tspan fill="#34d399" font-weight="bold">(A OR B) AND C</tspan> to prevent logic bugs!
  </text>
</svg>
