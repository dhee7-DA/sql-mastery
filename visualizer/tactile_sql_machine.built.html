  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">

<body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
const txM = (o, U, V) => `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K;
  const s = fill(sp(hull(pts3.map(([x,y,z]) => { const [a,b] = rotXY(x,y); return P0(a+(z-z0)*SH[0]*k, b+(z-z0)*SH[1]*k, z0); }))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  const k = INK_K, [X,Y] = P(...p3), fs = 8.6*k, w = text.length*fs*.62 + fs*1.5, h = fs*1.8, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

/* ---------- page shell ---------- */
const CORE_CSS = `
  :root{--paper:#f2efe7;--ink:#231e16;--muted:#857d6e;--rule:#ddd6c8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden;color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em} header span{color:var(--muted)}
  #fig{width:100%;max-width:760px;height:auto;display:block;margin:4px 0 8px;user-select:none;overflow:visible}
  #fig [data-act]{cursor:pointer}
  #readout, .idea{display:none}   /* status line + big idea are off: the buttons and motion tell the story */
  .idea{width:100%;max-width:760px;margin:-6px 0 16px;font-size:12.5px;line-height:1.5;text-align:center;color:var(--ink)}
  .idea strong{letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
  #readout{position:relative;min-height:1.4em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;text-align:center;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper)}
  .stage{position:relative;width:100%;max-width:760px}
  .actions{position:absolute;top:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2;max-width:220px}
  .actions .cap{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}

    border:1.5px solid var(--ink);border-radius:8px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;max-width:240px}
  .toast.show{opacity:1}

  .stat .v{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.small .v{font-size:20px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>

/* mountFigure({
     fig:'03', title:'Photo booth', hint:'click the curtain…',
     size:[W,D,H],                 // bounding box, used to frame the view (shadow range included)
     palette:'mustard',            // default PALS key
     state:{...},                  // figure state (st.pal is built in)
     scene: (st, m) => svgString,  // m = current palette {l,m,d}
     readout: st => 'text',        // status line under the figure

               | {label, choices: st => [{label, onClick(st,ui), current?, disabled?, why?}]}],   // opens a picker

   })  -> ui = { st, render, animate(stepFn), flash(text,ms) }

addEventListener('error', e => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + e.message + ';'; });
function mountFigure(cfg){
  document.title = cfg.title;
  const style = document.createElement('style'); style.textContent = CORE_CSS; document.head.appendChild(style);
  document.body.innerHTML = `
    <header><h1>Fig. ${cfg.fig} — ${cfg.title}</h1><span>${cfg.hint || ''}</span></header>
    <div class="stage">
      ${cfg.buttons && cfg.buttons.length ? `<div class="actions" id="btns"><div class="cap">${cfg.buttonsLabel || 'Try it'}</div></div>` : ''}
      ${cfg.stats ? '<div class="stats" id="stats"></div>' : ''}
      <div class="toast" id="toast" role="status"></div>
      <svg id="fig" role="img" aria-label="${cfg.title}"><defs id="fdefs"></defs><g id="art" filter="url(#hand)"></g></svg>
    </div>
    <div id="readout"></div>
    ${cfg.idea ? `<p class="idea"><strong>The big idea</strong>${cfg.idea}</p>` : ''}
    <div class="controls">
      <div class="ctl"><label for="wb">Hand-drawn wobble</label><input id="wb" type="range" min="0" max="7" step="0.1" value="2.4"></div>
      <div class="ctl"><label>Colour</label><div class="row" id="pals"></div></div>
      <div class="ctl" id="lblctl" hidden><label>Labels</label><div class="row"><button id="lbl" aria-pressed="true">On</button></div></div>
    </div>
    ${cfg.credit === false ? '' : '<footer class="made-with"><a href="https://april-zhu.com/colorfigures" target="_blank" rel="noopener">Made with Colorfigures ↗</a></footer>'}`;
  const st = cfg.state || {};            // kept as the same object, so a figure may hold on to it
  if (!st.pal) st.pal = cfg.palette || 'mustard';
  if (st.az == null) st.az = 105;
  const q = new URLSearchParams(location.search);
  if (PALS[q.get('pal')]) st.pal = q.get('pal');
  if (cfg.params) cfg.params(st, q);

  // frame on the object itself: centred, filling ~60% of the width / ~78% of the height of a 4:3 view.
  // The cast shadow is allowed to spill outside the frame (svg overflow is visible).
  const [W,D,H] = cfg.size, pts = [];
  OX = OY = 0; RC = cfg.center || [W/2, D/2];
  VIEW = 0;
  for (const x of [0,W]) for (const y of [0,D]) for (const z of [0,H]) pts.push(P(x,y,z));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const bw = Math.max(...xs)-Math.min(...xs), bh = Math.max(...ys)-Math.min(...ys);
  // the object fills ~74% of the width / ~88% of the height, nudged right of centre so the buttons (top left) stay clear
  const vbW = Math.max(bw/.74, bh/.88/.75), vbH = vbW*.75;
  OX = (vbW-bw)/2 + vbW*.06 - Math.min(...xs); OY = vbH*.04 - Math.min(...ys);   // sit a little high: shadows fall downward
  const svg = document.getElementById('fig');
  svg.setAttribute('viewBox', `0 0 ${f(vbW)} ${f(vbH)}`);
  INK_K = vbW / INK_REF_VB;
  document.getElementById('fdefs').innerHTML = filterFor(INK_K);

  const art = document.getElementById('art'), readout = document.getElementById('readout');
  const ui = { st };
  ui.render = () => { _clipN = 0; document.documentElement.style.setProperty('--accent', PALS[st.pal].l); art.innerHTML = inkScale(cfg.scene(st, PALS[st.pal])); if (!ui._flash) readout.textContent = cfg.readout ? cfg.readout(st) : ''; if (ui.drawStats) ui.drawStats(); };
  // big numbers in the top-right corner (credit, change, score…); a value that changes gets a little bump
  const statsEl = document.getElementById('stats'), prevStats = {};
  ui.drawStats = () => { if (!statsEl) return;
    const list = cfg.stats(st).filter(Boolean), html = list.map(x => `<div class="stat${x.small ? ' small' : ''}"><div class="k">${x.label}</div><div class="v" data-k="${x.label}">${x.value}</div></div>`).join('');
    if (statsEl._html !== html){ statsEl._html = html; statsEl.innerHTML = html;
      statsEl.querySelectorAll('.v').forEach(v => { if (prevStats[v.dataset.k] != null && prevStats[v.dataset.k] !== v.textContent) v.classList.add('bump'); prevStats[v.dataset.k] = v.textContent; }); } };
  let flashT = 0;
  const toast = document.getElementById('toast');
  ui.flash = (text, ms=1600) => { ui._flash = true; readout.textContent = text; toast.textContent = text;
    toast.style.top = ((document.getElementById('btns') ? document.getElementById('btns').offsetTop + document.getElementById('btns').offsetHeight : 0) + 8) + 'px'; toast.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; toast.classList.remove('show'); ui.render(); }, ms); };
  // animations run on a ~60 fps timer rather than requestAnimationFrame, so they also run in headless test shots
  ui.animate = step => { let last = performance.now();
    const loop = () => { const now = performance.now(), dt = Math.max(0, Math.min(.05,(now-last)/1000)); last = now; const more = step(dt) !== false; ui.render(); if (more) setTimeout(loop, 16); };
    setTimeout(loop, 16); };

  // clickable parts react on press, not on click: while something animates, the scene is redrawn every frame, so the
  // element under the pointer is replaced between press and release and a 'click' would never fire
  svg.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return;
    e.preventDefault(); cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

<script>
/* ============================================================================
   SQL FOUNDRY: RELATIONAL WASHER & PHYSICAL EXECUTION ENGINE (FIG. 15)
   Hand-inked isometric mechanical figure demonstrating how SQL queries
   execute as an authentic physical centrifugal separation process.
   ============================================================================ */

/* ---------- geometry (x = depth, y = width, z = up) ---------- */
const W = 62, D = 65, H = 88, PL = 4, RCR = 7;         // depth, width, height, foot height, corner radius
const OUT = rrUV(0, PL, D, H, RCR);                     // body profile in (y,z)
const CY = D/2, CZ = 39;                                // porthole centre on the front
const RO = 19, RB = 23.5, RG = 16.5, BT = 4.5;          // opening (drum) radius, bezel outer, glass radius, bezel thickness
const DRUM_D = 40;                                      // drum depth
const PANEL = [2, 68, D-2, H-2];                        // control strip
const DRW = [42, 72, 60, 83];                           // lexical predicate drawer opening y0,z0,y1,z1
const DIAL = [34, 77, 5.2];                             // y, z, r
const DISP = [11.8, 73, 24.6, 81.5];
const BTN = [7, 77, 3.1];
const DOOR_MAX = 98 * Math.PI/180, DRAWER_MAX = 15;
const hy = CY - RB - 1, uc = RB + 1;                    // hinge line & bezel centre in door coords

const STEEL = { l:'#8c9599', m:'#6a7377', d:'#454d51' };
const RUBBER = { l:'#5a5752', m:'#403d39', d:'#2a2825' };
const GREEN = '#43c25c', RED = '#e2483d', AMBER = '#f2b431';

/* ---------- helpers for the back and sides ---------- */
const txB = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const txR = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(-1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;

function smooth3(pts, it=3){
  for (let k=0;k<it;k++){ const o=[pts[0]];
    for (let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1];
      o.push(a.map((v,j)=>v*.75+b[j]*.25), a.map((v,j)=>v*.25+b[j]*.75)); }
    o.push(pts[pts.length-1]); pts=o; }
  return pts;
}

function tube(pts, r, m, rib=false){
  const q = smooth3(pts), d = pd(q, false), sw = w => `style="stroke-width:${f(w)}"`, cap = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const hl = 'M' + q.map(p => { const [X,Y] = P(...p); return f(X - r*.35)+' '+f(Y - r*.35); }).join('L');
  return `<path d="${d}" ${cap} stroke="${INK}" ${sw(2*r + 2.4*INK_K)}/>` + `<path d="${d}" ${cap} stroke="${m.m}" ${sw(2*r)}/>`
    + (rib ? `<path d="${d}" fill="none" stroke="${m.d}" ${sw(2*r)} stroke-dasharray=".45 1.1" opacity=".55"/>` : '')
    + `<path d="${hl}" ${cap} stroke="${m.l}" ${sw(r*.55)} opacity=".85"/>`;
}
const screw = (pl, u, v, r=1.1) => shape(on(pl, ellUV(u, v, r, r, 12)), METAL.m, .7) + ink(pd(on(pl, [[u-r*.7, v-r*.25],[u+r*.7, v+r*.25]]), false), .6);

/* ---------- SQL Execution Programs (Real Relational Physical Stages) ---------- */
const PROGS = [
  { name:'WHERE',  min:15, T:8,  fill:1.2, wash:4.5, drain:5.8, ang:55,  desc:'Centrifugal Filter (sal > $50k)' },
  { name:'JOIN',   min:45, T:10, fill:1.5, wash:6.5, drain:7.5, ang:105, desc:'Hash Key Interlock & Mesh' },
  { name:'GROUP',  min:30, T:7,  fill:1.0, wash:4.0, drain:5.0, ang:155, desc:'Hydraulic Bucket Compaction' },
  { name:'WINDOW', min:20, T:6,  fill:0.8, wash:3.5, drain:4.2, ang:205, desc:'Sliding Partition Aperture' },
  { name:'SCAN',   min:10, T:4,  fill:0.4, wash:2.0, drain:2.5, ang:255, desc:'Sequential Drum Tumble' }
];

const sstep = (a,b,t) => { const k = Math.min(1, Math.max(0, (t-a)/(b-a || 1e-9))); return k*k*(3-2*k); };
const phaseAt = (p,t) => t < p.fill ? 'fill' : t < p.wash ? 'wash' : t < p.drain ? 'drain' : 'spin';

function omegaAt(p,t){
  const ph = phaseAt(p,t);
  if (ph === 'fill') return 0.8;
  if (ph === 'wash') return 2.8 * (Math.sin((t - p.fill) * Math.PI / 1.5) >= 0 ? 1 : -1);
  if (ph === 'drain') return 1.4;
  return (1.6 + 21 * sstep(p.drain, p.drain + 1.2, t)) * (1 - sstep(p.T - .7, p.T, t));
}
function angleAt(p,t){ let a = 0; for (let s = 0; s < t; s += .01) a += omegaAt(p, s) * Math.min(.01, t - s); return a; }
function waterAt(p,t){ if (!p.fill) return 0; if (t < p.fill) return sstep(0, p.fill, t); if (t < p.wash) return 1; if (t < p.drain) return 1 - sstep(p.wash, p.drain, t); return 0; }

/* ---------- SQL Data Tuples (Physical Punchcards with Employee / Salary Records) ---------- */
function chaikin(pts, it=2){
  for (let k=0;k<it;k++){ const o=[]; for (let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length];
    o.push([a[0]*.75+b[0]*.25, a[1]*.75+b[1]*.25], [a[0]*.25+b[0]*.75, a[1]*.25+b[1]*.75]); } pts=o; }
  return pts;
}

// Data punchcard tokens
const SHAPES = {
  card: { body: chaikin([[-5.6,-3.6],[5.6,-3.6],[5.6,3.6],[-5.6,3.6]], 1),
          notch: [[-4.5, 3.6], [-3.5, 2.2], [-2.5, 3.6]],
          lines: [[[-4.5,-2.2],[4.5,-2.2]]] }
};

// 6 Tuples: Bob ($42k), Dave ($35k), and Frank ($28k) fail WHERE sal > 50k
const TUPLES = [
  { k:'card', tag:'101 ALICE $95k', col:'#3e86d9', d:6.5, heap:[-125, 11,   10], pass:true },
  { k:'card', tag:'102 BOB $42k',   col:'#e2473a', d:5.5, heap:[-160, 9,   -25], pass:false },
  { k:'card', tag:'103 CAROL $88k', col:'#f2c230', d:4.5, heap:[-82, 12,    75], pass:true },
  { k:'card', tag:'104 DAVE $35k',  col:'#fbf7ea', d:3.8, heap:[-108, 9.5,  15], pass:false },
  { k:'card', tag:'105 EVAN $110k', col:'#38a565', d:3.2, heap:[-150, 4.5,-110], pass:true },
  { k:'card', tag:'106 FRANK $28k', col:'#d94f86', d:2.6, heap:[-62, 8,    160], pass:false },
];

function tupleCard(c, cy, cz, psi, op=1){
  const sh = SHAPES.card, X = W - c.d, k = 1.35, cs = k*Math.cos(psi), sn = k*Math.sin(psi);
  const T = ([u,v]) => [X, cy + u*cs - v*sn, cz + u*sn + v*cs];
  const m = matOf(c.col);
  let s = fill(pd(sh.body.map(T)), m.l);
  s += fill(pd(sh.notch.map(T)), '#1f1e1a');
  for (const l of sh.lines) s += ink(pd(l.map(T), false), .8);
  s += ink(pd(sh.body.map(T)), 1.1);
  return op < 1 ? `<g opacity="${op}">${s}</g>` : s;
}

/* ---------- Results Basket on the Engine Floor ---------- */
const BASKET = { x0: W + 7, x1: W + 29, y0: 36, y1: 62, h: 11, r: 4 };
const SPOTS = [[W+13,43,20],[W+22,53,-35],[W+15,55,80],[W+23,43,140],[W+18,49,-100],[W+14,48,45]];
const FLY = .45, GAP = .28;
const xferEnd = () => (TUPLES.length - 1) * GAP + FLY;

const itemP = (st, i) => st.xfer ? Math.min(1, Math.max(0, (st.xfer.T - i*GAP) / FLY)) : 1;
function whereIs(st, i){
  if (!st.xfer) return st.tuplesLoc === 'basket' ? 'basket' : 'drum';
  const p = itemP(st, i);
  if (st.xfer.dir === 'out') return p <= 0 ? 'drum' : p >= 1 ? 'basket' : p;
  return p <= 0 ? 'basket' : p >= 1 ? 'drum' : 1 - p;
}

function tupleCard3(c, ctr, e1, e2, psi, op=1){
  const sh = SHAPES.card, k = 1.35, cs = k*Math.cos(psi), sn = k*Math.sin(psi);
  const T = ([u,v]) => { const a = u*cs - v*sn, b = u*sn + v*cs; return [ctr[0]+a*e1[0]+b*e2[0], ctr[1]+a*e1[1]+b*e2[1], ctr[2]+a*e1[2]+b*e2[2]]; };
  const m = matOf(c.col);
  let s = fill(pd(sh.body.map(T)), m.l);
  s += fill(pd(sh.notch.map(T)), '#1f1e1a');
  for (const l of sh.lines) s += ink(pd(l.map(T), false), .8);
  s += ink(pd(sh.body.map(T)), 1.1);
  return op < 1 ? `<g opacity="${op}">${s}</g>` : s;
}

const drumPos = c => { const [h0, hr] = c.heap, a = h0*Math.PI/180; return [W - c.d, CY + hr*Math.cos(a), CZ + hr*Math.sin(a)]; };
const basketPos = i => { const [x,y,t] = SPOTS[i]; return [x, y, BASKET.h - 2.2 + i*.35, t*Math.PI/180]; };

function flying(st){
  const parts = [];
  TUPLES.forEach((c, i) => {
    const w = whereIs(st, i); if (typeof w !== 'number') return;
    const a = drumPos(c), [bx,by,bz,bt] = basketPos(i), q = ease(w);
    const ctr = [a[0] + (bx-a[0])*q + 4*Math.sin(Math.PI*q), a[1] + (by-a[1])*q, a[2] + (bz-a[2])*q + 16*Math.sin(Math.PI*q)];
    const e2 = norm([q, 0, 1-q]);
    parts.push({ at: ctr, svg: tupleCard3(c, ctr, [0,1,0], e2, c.heap[2]*Math.PI/180*(1-q) + bt*q + 2.2*Math.sin(Math.PI*q)) });
  });
  return parts;
}

const PL_M = { l:'#7cc4ea', m:'#5aa6d0', d:'#2f6d92' };
const bRing = (z, ins) => { const B = BASKET; return on(PZ(z), rrUV(B.x0+ins, B.y0+ins, B.x1-ins, B.y1-ins, B.r)); };
const basketShadow = () => castShadow([...bRing(0, 1.5), ...bRing(BASKET.h, 0)]);
const basketAt = () => [(BASKET.x0 + BASKET.x1)/2, (BASKET.y0 + BASKET.y1)/2, BASKET.h/2];

function basket(st){
  const B = BASKET, ring = bRing;
  let s = '';
  const top = ring(B.h, 0), bot = ring(0, 1.5);
  s += loft(bot, top, n => toneI(n, PL_M));
  let sl = '';
  if (facing([1,0,0]))  for (let y = B.y0 + 6; y <= B.y1 - 6; y += 4) sl += pd([[B.x1-.6, y, 3.5],[B.x1-.6, y, 7.5]], false);
  if (facing([-1,0,0])) for (let y = B.y0 + 6; y <= B.y1 - 6; y += 4) sl += pd([[B.x0+.6, y, 3.5],[B.x0+.6, y, 7.5]], false);
  if (facing([0,1,0]))  for (let x = B.x0 + 6; x <= B.x1 - 6; x += 4) sl += pd([[x, B.y1-.6, 3.5],[x, B.y1-.6, 7.5]], false);
  if (facing([0,-1,0])) for (let x = B.x0 + 6; x <= B.x1 - 6; x += 4) sl += pd([[x, B.y0+.6, 3.5],[x, B.y0+.6, 7.5]], false);
  s += `<path d="${sl}" fill="none" stroke="${PL_M.d}" stroke-width="1.6" stroke-linecap="round"/>`;
  s += hullInk([...bot, ...top], 1.4);
  let inside = fill(pd(top), PL_M.d) + fill(pd(ring(B.h - 3, 1)), mix(PL_M.d, '#000000', .2));
  TUPLES.forEach((c, i) => { if (whereIs(st, i) !== 'basket') return; const [x,y,z,t] = basketPos(i); inside += tupleCard3(c, [x,y,z], [0,1,0], [1,0,0], t); });
  s += clipTo(top, inside);
  s += ink(pd(top), 1.4) + ink(pd(ring(B.h, 1.2)), .7);
  return s;
}

/* ---------- Predicate Injection Canister (Pours WHERE syntax into drawer) ---------- */
function soapBox(st){
  if (st.predicateAnim == null) return '';
  const t = st.predicateAnim, inn = Math.min(1, t/.2), out = t > .85 ? (t-.85)/.15 : 0;
  const tilt = (t < .2 ? 0 : t < .35 ? (t-.2)/.15 : t < .85 ? 1 : 1 - out) * 112 * Math.PI/180;
  const base = [W + DRAWER_MAX*.5, 59, 96 + 10*(1-ease(inn)) + 10*ease(out)], op = Math.min(inn, 1-out);
  const c = Math.cos(tilt), sn = Math.sin(tilt), wx = 6, wy = 9, h = 12;
  const X = ([x,y,z]) => [base[0] + x, base[1] + y*c - z*sn, base[2] + y*sn + z*c], R = ([x,y,z]) => [x, y*c - z*sn, y*sn + z*c];
  const BOX = matOf('#f08a2b');
  const F = [
    [[1,0,0],  [[wx/2,-wy/2,0],[wx/2,wy/2,0],[wx/2,wy/2,h],[wx/2,-wy/2,h]]],
    [[-1,0,0], [[-wx/2,-wy/2,0],[-wx/2,wy/2,0],[-wx/2,wy/2,h],[-wx/2,-wy/2,h]]],
    [[0,1,0],  [[-wx/2,wy/2,0],[wx/2,wy/2,0],[wx/2,wy/2,h],[wx/2,-wy/2,h]]],
    [[0,-1,0], [[-wx/2,-wy/2,0],[wx/2,-wy/2,0],[wx/2,-wy/2,h],[-wx/2,-wy/2,h]]],
    [[0,0,1],  [[-wx/2,-wy/2,h],[wx/2,-wy/2,h],[wx/2,wy/2,h],[-wx/2,-wy/2,h]]],
    [[0,0,-1], [[-wx/2,-wy/2,0],[wx/2,-wy/2,0],[wx/2,wy/2,0],[-wx/2,wy/2,0]]] ];
  let s = '';
  for (const [n, q] of F){ const rn = R(n); if (!vis(rn)) continue;
    s += shape(q.map(X), n[2] === 1 ? '#fbf7ea' : toneI(rn, BOX), 1);
    if (n[0] === 1) s += fill(pd([[wx/2+.05,-wy/2,h*.45],[wx/2+.05,wy/2,h*.45],[wx/2+.05,wy/2,h*.7],[wx/2+.05,-wy/2,h*.7]].map(X)), '#fbf7ea'); }
  if (t > .33 && t < .87){
    const sp = X([0, -wy/2, h]), zb = DRW[3] - 1.2, ys = 51;
    s += `<path d="${pd([sp, [sp[0]-1, ys, zb]], false)}" fill="none" stroke="#6fa6e8" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1.6 1.3" stroke-dashoffset="${f(-t*60)}"/>`;
  }
  return `<g opacity="${f(op)}">${s}</g>`;
}

/* ---------- State helpers ---------- */
const prog = st => PROGS[st.prog];
const fmt = ms => (ms / 10).toFixed(2) + 'ms';
const remaining = st => { const p = prog(st); return st.run ? Math.max(1, Math.ceil(p.min * (1 - st.tau / p.T))) : p.min; };

/* ---------- The Drum (Centrifugal Relational Washing Machine) ---------- */
const ringX = (x, r, n=36) => on(PX(x), ellUV(CY, CZ, r, r, n));
const wallVis = (dy, dz) => { const r = rotV([0, -dy, -dz]); return r[0] + r[1] + r[2]; };

function drum(st){
  const p = prog(st), t = st.tau, run = st.run;
  const A = run ? angleAt(p, t) : st.restA, om = run ? omegaAt(p, t) : 0, fast = Math.abs(om) > 7;
  let s = fill(pd(ringX(W - DRUM_D, RO)), '#2b3134');
  s += ink(pd(ringX(W - DRUM_D + .1, 5)), .8);

  const secs = [[0,7,0],[7,16,.18],[16,DRUM_D,.36]];
  for (const [a,b,k] of secs){
    const dm = { l:mix(STEEL.l,'#000000',k), m:mix(STEEL.m,'#000000',k), d:mix(STEEL.d,'#000000',k) };
    s += loft(ringX(W - a, RO), ringX(W - b, RO), n => toneI(n, dm), true);
  }

  // Perforated perforations / motion streaks
  const dep = [2.5, 6, 9.5, 13, 16.5, 20, 24];
  if (fast){
    for (const d of dep){ const arc = ellUV(CY, CZ, RO-.05, RO-.05, 48).filter(([y,z]) => wallVis(y-CY, z-CZ) > 0).map(([y,z]) => [W-d,y,z]);
      s += `<path d="${pd(arc,false)}" fill="none" stroke="#1d2224" stroke-width=".9" stroke-dasharray="1 2.4" opacity=".7"/>`; }
  } else {
    let dots = '';
    for (const d of dep) for (let i = 0; i < 24; i++){
      const a = A + (i + (d*.37 % 1)) / 24 * 2*Math.PI, cy = Math.cos(a), sz = Math.sin(a);
      if (wallVis(cy, sz) < .15) continue;
      const q = (da, dx) => [W - d + dx, CY + (RO-.05)*Math.cos(a+da), CZ + (RO-.05)*Math.sin(a+da)];
      dots += pd([q(-.035,-.45), q(.035,-.45), q(.035,.45), q(-.035,.45)]);
    }
    s += `<path d="${dots}" fill="#20262a"/>`;
  }

  // 3 Internal lifters / baffles
  for (let k = 0; k < 3; k++){
    const a = A + k * 2*Math.PI/3 + .4;
    if (wallVis(Math.cos(a), Math.sin(a)) < -.2) continue;
    const q = (r, da, d) => [W - d, CY + r*Math.cos(a+da), CZ + r*Math.sin(a+da)];
    const op = fast ? ' opacity=".45"' : '';
    s += `<g${op}>` + shape([q(RO,-.2,1), q(RO,-.2,DRUM_D-4), q(RO-2.4,0,DRUM_D-4), q(RO-2.4,0,1)], '#9aa3a6', .7)
       + shape([q(RO,.2,1), q(RO,.2,DRUM_D-4), q(RO-2.4,0,DRUM_D-4), q(RO-2.4,0,1)], '#b8c0c2', .7) + `</g>`;
  }

  // Tuples in the drum: Centrifuged!
  // In WHERE program: non-matching rows (pass=false) are flung out through perforations when spinning fast!
  const spread = run ? sstep(0, .9, t) * (1 - sstep(p.T - .8, p.T, t)) : 0;
  const spinK = run ? sstep(p.drain, p.drain + 1, t) * (1 - sstep(p.T - .8, p.T, t)) : 0;
  const filteredAway = (c) => run && p.name === 'WHERE' && !c.pass && t > p.drain;

  const items = TUPLES.map((c, i) => ({ c, i }))
    .filter(o => whereIs(st, o.i) === 'drum' && !filteredAway(o.c))
    .map(({ c, i }) => {
      const [h0, hr, ht] = c.heap, even = -Math.PI/2 + i * 2*Math.PI/TUPLES.length;
      const base = h0*Math.PI/180 * (1-spread) + even * spread;
      const ang = base + A * spread;
      const r = hr * (1-spread) + (9.5 + 2.2*Math.sin(A*1.3 + i*1.7)) * spread * (1-spinK) + 14.3 * spinK * spread;
      const psi = ht*Math.PI/180 + A * spread * (1 + .25*Math.sin(i));
      return { c, ang, r, psi };
    }).sort((a,b) => b.c.d - a.c.d);

  for (const o of items){
    if (fast) for (let g = 3; g >= 1; g--){ const ga = o.ang - Math.sign(om) * g * .26;
      s += tupleCard(o.c, CY + o.r*Math.cos(ga), CZ + o.r*Math.sin(ga), o.psi - Math.sign(om)*g*.26, .34 - g*.08); }
    s += tupleCard(o.c, CY + o.r*Math.cos(o.ang), CZ + o.r*Math.sin(o.ang), o.psi);
  }

  // Relational wash fluid / turbulence waves
  const lv = run ? waterAt(p, t) : 0;
  if (lv > .01){
    const zl = CZ - RO - 1 + lv * 17, xw = W - 2, top = [];
    for (let y = CY + RO + 2; y >= CY - RO - 2; y -= 1)
      top.push([xw, y, zl + 1.1*Math.sin(y*.55 + t*7) + .6*Math.sin(y*.21 - t*4) + .07*(y-CY)*Math.sign(om)]);
    const poly = [...top, [xw, CY-RO-2, CZ-RO-3], [xw, CY+RO+2, CZ-RO-3]];
    s += fill(pd(poly), '#4f9fdc', 'opacity=".42"');
    s += `<path d="${pd(top,false)}" fill="none" stroke="#d7f0ff" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>`;
    if (phaseAt(p,t) === 'wash') for (let i = 0; i < 9; i++){
      const y = CY - 13 + i*3.3 + Math.sin(t*3 + i)*1.2, z = zl + 1.1*Math.sin(y*.55 + t*7) + .3;
      s += fill(pd(on(PX(xw - .2), ellUV(y, z, 1 + (i%3)*.35, .8 + (i%2)*.3, 10))), '#ffffff', 'opacity=".85"');
    }
  }

  // Rubber mouth gasket
  s += loft(ringX(W, RO - 2.2), ringX(W - 3, RO - 2.2), n => toneI(n, RUBBER), true);
  s += fill(pd(ringX(W, RO)) + pd(ringX(W, RO - 2.2)), RUBBER.m, 'fill-rule="evenodd"') + ink(pd(ringX(W, RO - 2.2)), .9);
  return s;
}

/* ---------- The Porthole Door (Bezel Ring + Glass) ---------- */
const dP = (a,u,v,th) => [W + a*Math.cos(th) + u*Math.sin(th), hy - a*Math.sin(th) + u*Math.cos(th), v];
const dRing = (a, r, th, n=40) => ellUV(uc, CZ, r, r, n).map(([u,v]) => dP(a,u,v,th));

function dBox(a0,a1,u0,u1,v0,v1,m,th,w=1){
  const c = (a,u,v) => dP(a,u,v,th), nA = [Math.cos(th), -Math.sin(th), 0], nU = [Math.sin(th), Math.cos(th), 0];
  const F = [
    [nA, [c(a1,u0,v0),c(a1,u1,v0),c(a1,u1,v1),c(a1,u0,v1)]], [nA.map(x=>-x), [c(a0,u0,v0),c(a0,u1,v0),c(a0,u1,v1),c(a0,u0,v1)]],
    [nU, [c(a0,u1,v0),c(a1,u1,v0),c(a1,u1,v1),c(a0,u1,v1)]], [nU.map(x=>-x), [c(a0,u0,v0),c(a1,u0,v0),c(a1,u0,v1),c(a0,u0,v1)]],
    [[0,0,1], [c(a0,u0,v1),c(a1,u0,v1),c(a1,u1,v1),c(a0,u1,v1)]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, toneI(n,m), w)).join('');
}

const BEZEL = { l:'#f4f5f3', m:'#c9cfd0', d:'#8f989b' };

function door(st){
  const th = ease(st.door) * DOOR_MAX, nF = [Math.cos(th), -Math.sin(th), 0];
  let s = '';
  for (const z of [CZ+9, CZ-13]) s += dBox(.5, 3.4, -1, 3, z, z+4, METAL, th, .9);
  s += loft(dRing(0, RB, th), dRing(BT, RB, th), n => toneI(n, BEZEL));
  if (vis(nF)){
    s += loft(dRing(1.5, RG, th), dRing(BT, RG, th), n => toneI(n, { l:'#d9dedf', m:'#aab2b4', d:'#7d8689' }), true);
    const gl = dRing(1.5, RG, th);
    s += fill(pd(gl), '#cfe9f0', `opacity="${st.door > 0 ? .5 : .2}"`);
    const st1 = [[-9,-15],[-3,-15],[13,13],[7,13]].map(([u,v]) => dP(1.5, uc+u, CZ+v, th));
    const st2 = [[-0,-15],[2.5,-15],[18.5,13],[16,13]].map(([u,v]) => dP(1.5, uc+u, CZ+v, th));
    s += clipTo(gl, fill(pd(st1),'#ffffff','opacity=".36"') + fill(pd(st2),'#ffffff','opacity=".36"'));
    const fo = dRing(BT, RB, th), fi = dRing(BT, RG, th);
    s += `<path d="${pd(fo)}${pd(fi)}" fill="${toneI(nF, BEZEL)}" fill-rule="evenodd"/>`;
    s += ink(pd(dRing(BT+.05, RG + 3.2, th)), .7) + ink(pd(fi), 1.5) + ink(pd(fo), 1.8);
    s += dBox(BT-1, BT+2, 2*RB - 2, 2*RB + 3, CZ - 6.5, CZ + 6.5, BEZEL, th, 1.1);
    s += dBox(BT+2, BT+2.6, 2*RB, 2*RB + 2.5, CZ - 5, CZ + 5, matOf('#9aa3a6'), th, .8);
  } else {
    const bo = dRing(0, RB, th), bi = dRing(0, RG, th);
    s += `<path d="${pd(bo)}${pd(bi)}" fill="${toneI(nF.map(x=>-x), BEZEL)}" fill-rule="evenodd"/>` + ink(pd(bo), 1.8);
    s += fill(pd(bi), '#cfe9f0', 'opacity=".35"');
    const b0 = dRing(0, RG, th), b1 = dRing(-4, RG - 3.5, th), b2 = dRing(-6, RG - 8, th);
    s += `<g opacity=".72">` + loft(b0, b1, n => toneI(n, CLEAR)) + loft(b1, b2, n => toneI(n, CLEAR)) + fill(pd(b2), CLEAR.l) + `</g>`;
    s += ink(pd(b2), .9) + hullInk([...b0, ...b1, ...b2], 1.2);
    const gl = [[-4,-9],[-1.5,-9],[6,6],[3.5,6]].map(([u,v]) => dP(-5.2, uc+u, CZ+v, th));
    s += fill(pd(gl), '#ffffff', 'opacity=".45"');
  }
  return act('door', s);
}

/* ---------- Lexical Detergent Drawer (WHERE / JOIN / GROUP inputs) ---------- */
function drawer(st){
  const s0 = ease(st.drawer) * DRAWER_MAX, xf = W + s0;
  const [y0,z0,y1,z1] = DRW;
  let s = '';
  if (s0 > .2){
    const by0 = y0 + .6, by1 = y1 - .6, bz0 = z0 + .6, bz1 = z1 - 1.2;
    const sw = facing([0,1,0]) ? by1 : by0;
    s += shape([[W,sw,bz0],[xf,sw,bz0],[xf,sw,bz1],[W,sw,bz1]], '#d6dadb', 1);
    s += shape([[W,by0,bz1],[xf,by0,bz1],[xf,by1,bz1],[W,by1,bz1]], '#eef0f0', 1);
    // 3 SQL syntax slots: WHERE (I) | JOIN (II) | AGG (S)
    const comp = [[by0+.8, by0+5.2, '#3a3e40'], [by0+6, by1-5.4, '#3a3e40'], [by1-4.6, by1-.8, '#3a3e40']];
    const xa = W + .2, xb = xf - .9;
    if (xb > xa) comp.forEach(([a,b,c], i) => {
      s += shape([[xa,a,bz1],[xb,a,bz1],[xb,b,bz1],[xa,b,bz1]], c, .7);
      if (i === 1 && st.predicateLvl > .02) s += fill(pd([[xa,a+.6,bz1+.05],[xb-.6,a+.6,bz1+.05],[xb-.6,b-.6,bz1+.05],[xa,b-.6,bz1+.05]]), '#dfe9f7', `opacity="${f(Math.min(1, st.predicateLvl*1.4))}"`) +
        `<path d="${[0,1,2,3,4,5].slice(0, Math.ceil(st.predicateLvl*6)).map(k => pd(on(PZ(bz1+.1), ellUV(xa + (xb-xa)*(.2+.13*k), a+1.5+(k%3)*1.6, .35, .35, 6)))).join('')}" fill="#6fa6e8"/>`;
      if (i === 2) s += fill(pd([[xa,a+.5,bz1+.05],[xb-.5,a+.5,bz1+.05],[xb-.5,b-.5,bz1+.05],[xa,b-.5,bz1+.05]]), '#c99de8', 'opacity=".9"');
    });
  }
  const m = { l:'#f7f6f1', m:'#dcdad0', d:'#a8a597' };
  s += box(xf, y0+.2, z0+.2, xf + 1.4, y1-.2, z1-.2, m, toneI, 1.2);
  s += shape(on(PX(xf + 1.45), rrUV(y0 + 4, z0 + 1.6, y1 - 4, z0 + 3.4, .9)), '#3a3e40', .8);
  s += tx(xf + 1.5, (y0+y1)/2, z0 + 6.1, 'WHERE JOIN AGG', 2.3, '#6a6658', 800);
  return act('drawer', s);
}

/* ---------- Control Panel Pieces ---------- */
function dial(st){
  const [y,z,r] = DIAL, F = W + .25;
  let s = cylX(F, F + 2.6, y, z, r, BEZEL, toneI, 1.2, 28);
  const a = PROGS[st.prog].ang * Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  const bar = [[-1.1,-4.3],[1.1,-4.3],[1.1,4.3],[-1.1,4.3]].map(([u,v]) => [y + u*sa + v*ca, z - u*ca + v*sa]);
  const B0 = on(PX(F + 2.6), bar), B1 = on(PX(F + 4.4), bar);
  s += loft(B0, B1, n => toneI(n, BEZEL)) + fill(pd(B1), BEZEL.l) + hullInk([...B0, ...B1], 1) + ink(pd(B1), .8);
  s += fill(pd(on(PX(F + 4.45), ellUV(y + 3.2*ca, z + 3.2*sa, .7, .7, 10))), RED);
  let t = '';
  PROGS.forEach((p, i) => {
    const pa = p.ang * Math.PI/180, sel = i === st.prog;
    t += fill(pd(on(PX(W + .3), ellUV(y + 6*Math.cos(pa), z + 6*Math.sin(pa), .7, .7, 10))), sel ? GREEN : '#b5b2a6');
    t += tx(W + .3, y + 8*Math.cos(pa), z + 8*Math.sin(pa) - .9, p.name[0], 2.6, sel ? INK : '#6a6658', 800);
  });
  return t + act('dial', s);
}

function display(st){
  const [y0,z0,y1,z1] = DISP, cy = (y0+y1)/2, p = prog(st);
  let s = shape(on(PX(W + .3), rrUV(y0, z0, y1, z1, 1.6)), '#1d2a26', 1.2);
  let l1, l2;
  if (st.done && !st.run){ l1 = 'SQL PASS'; l2 = '3 ROWS'; }
  else if (st.run){ const ph = phaseAt(p, st.tau); l1 = st.paused ? 'PAUSED' : { fill:'PARSE', wash:'FILTER', drain:'FLUSH', spin:'CENTRIFUGE' }[ph]; l2 = fmt(remaining(st)); }
  else { l1 = p.name; l2 = fmt(p.min); }
  s += tx(W + .4, cy, z0 + 5.6, l1, 2.5, '#8af0ae', 700);
  s += tx(W + .4, cy, z0 + 1.7, l2, 3.6, '#8af0ae', 800);
  return s;
}

function startBtn(st){
  const [y,z,r] = BTN, lit = st.run ? (st.paused ? AMBER : GREEN) : st.done ? GREEN : '#b5b2a6';
  let s = fill(pd(on(PX(W + .25), ellUV(y, z, r + 1, r + 1, 24))), lit) + ink(pd(on(PX(W + .25), ellUV(y, z, r + 1, r + 1, 24))), .9);
  s += cylX(W + .3, W + 2.4, y, z, r, BEZEL, toneI, 1.1, 24);
  const tri = [[y + 1, z - 1.4], [y + 1, z + 1.4], [y - 1.4, z]];
  s += fill(pd(on(PX(W + 2.45), tri)), INK);
  return act('start', s) + tx(W + .3, y, PANEL[1] + 1.4, 'EXECUTE', 1.8, '#6a6658', 800);
}

/* ---------- The Back and Right Side ---------- */
const BK = PX(-.15);
const CORD = [[-1.6,12,82],[-3.6,12.4,79.5],[-5,13,71],[-5.8,13.6,44],[-6.2,14.2,16],[-6.8,15.2,3.4],[-7.6,17.6,1],[-8.6,20,1.2],[-9.5,20.5,1.7]];
const INLET = [[-4.6,44,81],[-7.6,44.4,79],[-10,45,72],[-11.6,45.6,50],[-12.4,46,22],[-12.8,45.4,6],[-14,44.2,1.6],[-16.5,42.6,1.3]];
const DRAIN_UP = [[-2.6,24,13],[-2.9,24,30],[-2.9,24,52],[-3,24.2,66]];
const DRAIN_DN = [[-3,24.2,66],[-3.4,24.5,70.5],[-6.6,25.2,72],[-9.4,25.8,67],[-12.6,26.4,52],[-15.6,26.8,30],[-17.6,27.2,12],[-19.4,27.6,3],[-22,28,1.4],[-25,28.4,1.4]];
const HOSE_M = matOf('#a9b0b2'), CORD_M = { l:'#5b5650', m:'#2f2c29', d:'#1b1917' }, INLET_M = { l:'#ffffff', m:'#e8ecec', d:'#b9c0c1' };
const TAP_B = matOf('#3e86d9'), TAP_R = matOf('#e2483d'), CAPS = matOf('#dedbd0');

function backFace(m){
  const tb = tone([-1,0,0], m), dk = mix(tb, '#000000', .06);
  let s = '';
  s += shape(on(BK, rrUV(32, 24, 58, 64, 3)), dk, 1.2);
  for (const z of [55.5, 52, 48.5, 45]) s += shape(on(PX(-.2), rrUV(37, z, 53, z + 1.6, .8)), mix(tb, '#000000', .45), .7);
  for (const [u,v] of [[35,27],[55,27],[35,61],[55,61]]) s += screw(PX(-.2), u, v);
  for (const u of [22, 36, 58]) s += screw(PX(-.2), u, 85.3, 1);
  s += shape(on(PX(-.2), rectUV(36, 7.5, 58, 19)), '#fbf7ea', .9);
  s += txB(-.3, 47, 15.8, 'SQL-WASH 15', 2, INK, 800);
  s += txB(-.3, 47, 13, 'DUCKDB-WASM 2.0', 1.25, '#6a6658', 700);
  let bc = ''; for (let i = 0; i < 18; i++){ const u = 39 + i*.9; if (i % 3 !== 1) bc += pd([[-.25, u, 8.8],[-.25, u, 11.2]], false); }
  s += `<path d="${bc}" fill="none" stroke="${INK}" stroke-width=".7"/>`;
  s += txB(-.3, 48, 76, 'QUERY', 1.8, mix(tb, '#000000', .6), 800);
  s += txB(-.3, 24, 8.5, 'SLUDGE', 1.8, mix(tb, '#000000', .6), 800);
  return s;
}

function backBits(){
  let s = '';
  for (const [y,z] of [[17,40],[61,44],[40,70]]) s += cylX(-1.2, 0, y, z, 2.6, CAPS, toneI, .9, 18) + ink(pd(on(PX(-1.25), [[y-1.3, z],[y+1.3, z]]), false), .7);
  s += cylX(-1.6, 0, 12, 82, 1.9, RUBBER, toneI, .9, 18);
  s += cylX(-2.6, 0, 24, 13, 2.5, HOSE_M, toneI, 1, 18);
  s += cylX(-2.4, 0, 52, 81, 1.4, METAL, toneI, .8, 18) + cylX(-4.6, -2.4, 52, 81, 2.2, TAP_R, toneI, 1, 18);
  s += cylX(-2.4, 0, 44, 81, 1.4, METAL, toneI, .8, 18) + cylX(-4.6, -2.4, 44, 81, 2.3, TAP_B, toneI, 1, 18);
  const mid = pts => avg(pts);
  const plug = box(-14, 18, 0, -9.5, 23, 3.4, CORD_M, toneI, 1) + [19.5, 21.5].map(y =>
      `<path d="${pd([[-14, y, 1.7],[-16.6, y, 1.7]], false)}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>`
    + `<path d="${pd([[-14, y, 1.7],[-16.6, y, 1.7]], false)}" fill="none" stroke="${METAL.m}" style="stroke-width:.5" stroke-linecap="round"/>`).join('');
  s += byDepth([
    { at: mid(CORD), svg: tube(CORD, .75, CORD_M) },
    { at: [-11.75, 20.5, 1.7], svg: plug },
    { at: mid(INLET), svg: tube(INLET, 1.3, INLET_M) + cylX(-19.6, -16.5, 42.4, 1.6, 1.6, TAP_B, toneI, .9, 18) },
    { at: mid(DRAIN_UP), svg: tube(DRAIN_UP, 1.8, HOSE_M, true) + box(-5.2, 21.6, 58, -1.8, 26.4, 61.5, METAL, toneI, .9) },
    { at: mid(DRAIN_DN), svg: tube(DRAIN_DN, 1.8, HOSE_M, true) },
  ]);

}

function sideRight(m){
  const sm = tone([0,-1,0], m), pl = PY(-.2), tc = mix(sm, m.d, .3);
  let s = '';
  s += shape(on(pl, rrUV(12, 36, W - 12, 64, 6)), mix(sm, '#ffffff', .12), 1.2);
  for (const [u,v,r] of [[W-20, 56, 3.4],[W-27, 59.5, 2],[W-25, 52.5, 1.4]]) s += shape(on(PY(-.25), ellUV(u, v, r, r, 16)), tc, .9);
  s += txR(W/2 - 3, -.3, 47, 'SQL-WASH', 4.6, tc, 800);
  s += txR(W/2 - 3, -.3, 41, 'RELATIONAL DRIVE', 2.4, tc, 800);
  for (let k = 0; k < 6; k++){ const u = 7 + k*2.6; s += shape(on(PY(-.25), rrUV(u, 10, u + 1.2, 22, .6)), mix(sm, '#000000', .45), .7); }
  s += shape(on(PY(-.25), [[W-17, 12],[W-9, 12],[W-13, 19]]), '#f2c230', .9);
  s += txR(W - 13, -.3, 12.8, '!', 4, INK, 900);

/* ---------- Inside View: Database Engine Mechanics (X-Ray) ---------- */
const XT0 = 15, XT1 = W - 3, RT = 22.5;
const XD0 = W - 2 - 38, XD1 = W - 2;
const XPU = 10, RPU = 17;
const MOT = { x0: 13, x1: 31, y: CY + 6, z: 10.5, r: 4.6, rp: 2.3 };
const PUMP = { x0: 44, x1: 56, y: 10.5, z: 9, r: 4 };
const TUBM = { l:'#eef0ee', m:'#cdd3d2', d:'#9aa4a4' }, ALU = { l:'#e6e9ea', m:'#b9c0c3', d:'#7f888c' };
const MOTM = { l:'#7d8a96', m:'#5e6b77', d:'#3c4650' }, CONC = { l:'#d6d2c8', m:'#b5b0a4', d:'#8a857a' };
const VALVE = { l:'#f2efe6', m:'#d6d1c3', d:'#a29c8b' }, COPPER = { l:'#e6a46d', m:'#c47c45', d:'#8a4e24' };
const WATER = '#4f9fdc';
const ringT = (x, r, n=40) => on(PX(x), ellUV(CY, CZ, r, r, n));
const tubZ = dy => CZ - Math.sqrt(RT*RT - dy*dy);
const tubTop = dy => CZ + Math.sqrt(RT*RT - dy*dy);

function coil(a, b, r, turns, w=1){
  const d = norm(sub(b, a)), u = norm(cross(d, [1,0,0])), v = cross(d, u), pts = [], n = turns*14;
  for (let i = 0; i <= n; i++){ const t = i/n, g = t*turns*2*Math.PI, c = Math.cos(g)*r, s = Math.sin(g)*r;
    pts.push([a[0]+(b[0]-a[0])*t + u[0]*c + v[0]*s, a[1]+(b[1]-a[1])*t + u[1]*c + v[1]*s, a[2]+(b[2]-a[2])*t + u[2]*c + v[2]*s]); }
  const dd = pd(pts, false);
  return `<path d="${dd}" fill="none" stroke="${INK}" stroke-width="${2.2*w}" stroke-linecap="round"/><path d="${dd}" fill="none" stroke="${METAL.m}" style="stroke-width:.55" stroke-linecap="round"/>`;
}

function tubPart(st, k, sway, A, lv, heat){
  const op = (o, s) => `<g opacity="${o}">${s}</g>`, back = vis([-1,0,0]), front = vis([1,0,0]);
  const A0 = ringT(XT0, RT), A1 = ringT(XT1, RT);
  let s = '';
  s += op(.55, loft(A0, A1, n => toneI(n, TUBM), true) + (!back ? fill(pd(A0), TUBM.d) : '') + (!front ? fill(pd(A1), TUBM.d) : ''));
  if (lv > .01){
    const zl = CZ - RT + .6 + lv*19, a0 = Math.asin(Math.max(-1, Math.min(1, (zl - CZ)/(RT - .4))));
    const prof = arcUV(CY, CZ, RT - .4, 180 - a0*180/Math.PI, 360 + a0*180/Math.PI, 24);
    s += op(.5, extrude(prof, XT0 + .4, XT1 - .4, { l:'#9fd0f2', m:'#6fb2e6', d:'#3f86c4' }, toneI));
  }
  const hm = heat > 0 ? { l: mix(COPPER.l, '#ff7a2a', heat), m: mix(COPPER.m, '#ff5a1a', heat), d: mix(COPPER.d, '#c2300a', heat) } : COPPER;
  const hz = tubZ(0) + 2.1;
  s += rod([XT1 - 2, CY - 3, hz], [XT0 + 9, CY - 3, hz], .75, hm) + rod([XT0 + 9, CY + 3, hz], [XT1 - 2, CY + 3, hz], .75, hm)
     + rod([XT0 + 9, CY - 3, hz], [XT0 + 9, CY + 3, hz], .75, hm);
  if (heat > .05) s += `<path d="${pd([[XT1 - 2, CY, hz],[XT0 + 9, CY, hz]], false)}" stroke="#ff8a3a" style="stroke-width:${f(6*heat)}" opacity="${f(.25*heat)}" stroke-linecap="round"/>`;

  const R0 = ringT(XD0, RO), R1 = ringT(XD1, RO);
  s += loft(R0, R1, n => toneI(n, STEEL));
  let dots = '';
  const fast = Math.abs(st.run ? omegaAt(prog(st), st.tau) : 0) > 7;
  for (let x = XD0 + 3; x < XD1 - 2; x += 3.4) for (let i = 0; i < 30; i++){
    const a = A + (i + (x*.37 % 1)) / 30 * 2*Math.PI, n = [0, Math.cos(a), Math.sin(a)];
    if (d3(rotV(n), [1,1,1]) < .25) continue;
    const q = (da, dx) => [x + dx, CY + (RO+.05)*Math.cos(a+da), CZ + (RO+.05)*Math.sin(a+da)];
    dots += fast ? pd([q(-.25,0), q(.25,0)], false) : pd([q(-.03,-.45), q(.03,-.45), q(.03,.45), q(-.03,.45)]);
  }
  s += fast ? `<path d="${dots}" fill="none" stroke="#2a3134" stroke-width=".8" opacity=".6"/>` : `<path d="${dots}" fill="#2a3134"/>`;
  if (back){ s += fill(pd(R0), toneI([-1,0,0], STEEL));
    for (let j = 0; j < 3; j++){ const a = A + j*2*Math.PI/3; s += shape(on(PX(XD0 - .3), [[CY + 2*Math.cos(a+.5), CZ + 2*Math.sin(a+.5)], [CY + 17*Math.cos(a+.12), CZ + 17*Math.sin(a+.12)], [CY + 17*Math.cos(a-.12), CZ + 17*Math.sin(a-.12)], [CY + 2*Math.cos(a-.5), CZ + 2*Math.sin(a-.5)]]), ALU.m, .8); }
    s += ink(pd(R0), 1); }
  s += hullInk([...R0, ...R1], 1.6) + ink(pd(R1), .9);

  if (front) s += clipTo(ringX(XD1, RO - .2), drum(st));
  s += op(.32, loft(A0, A1, n => toneI(n, TUBM)) + (back ? fill(pd(A0), toneI([-1,0,0], TUBM)) : ''));
  s += ink(pd(A0), .9) + ink(pd(A1), .9) + hullInk([...A0, ...A1], 1.6);

  const g0 = ringT(XT1, RT - 1.5), g1 = ringT(W - .3, RO + 1.2);
  s += op(.85, loft(g1, g0, n => toneI(n, RUBBER))) + ink(pd(g0), .8);
  return s;
}

function pulleyBelt(st, A){
  let s = '';
  const fx = vis([1,0,0]) ? XPU + 1.2 : XPU - 1.2, fn = vis([1,0,0]) ? [1,0,0] : [-1,0,0];
  s += rod([XPU - 1.4, CY, CZ], [XT0, CY, CZ], 1.5, METAL);
  s += cylX(XPU - 1.2, XPU + 1.2, CY, CZ, RPU, ALU, toneI, 1.4, 40);
  let win = '';
  for (let j = 0; j < 5; j++){ const a0 = A + j*2*Math.PI/5;
    win += pd(on(PX(fx + (fn[0] > 0 ? .05 : -.05)), [...arcUV(CY, CZ, 5.5, (a0+.22)*180/Math.PI, (a0+1.0)*180/Math.PI, 5), ...arcUV(CY, CZ, 13.5, (a0+1.0)*180/Math.PI, (a0+.22)*180/Math.PI, 7)])); }
  s += `<path d="${win}" fill="${ALU.d}" stroke="${INK}" stroke-width=".7"/>`;
  s += shape(on(PX(fx + fn[0]*.1), ellUV(CY, CZ, 3, 3, 16)), ALU.m, .8);

  const c1 = [CY, CZ], c2 = [MOT.y, MOT.z], r1 = RPU + .3, r2 = MOT.rp + .3, d = [c2[0]-c1[0], c2[1]-c1[1]];
  const L = Math.hypot(...d), ph = Math.atan2(d[1], d[0]), be = Math.acos((r1 - r2)/L);
  const pt = (c, r, a) => [c[0] + r*Math.cos(a), c[1] + r*Math.sin(a)], loop = [];
  for (let i = 0; i <= 10; i++) loop.push(pt(c2, r2, ph + be - 2*be*i/10));
  for (let i = 0; i <= 40; i++) loop.push(pt(c1, r1, ph - be - (2*Math.PI - 2*be)*i/40));
  const bp = pd(on(PX(XPU), loop));
  s += `<path d="${bp}" fill="none" stroke="${INK}" style="stroke-width:${f(2.6*INK_K + 1.6)}" stroke-linejoin="round"/>`
     + `<path d="${bp}" fill="none" stroke="#3a3632" style="stroke-width:1.6" stroke-linejoin="round"/>`
     + `<path d="${bp}" fill="none" stroke="#8a8378" style="stroke-width:.6" stroke-dasharray="1 2.2" stroke-dashoffset="${f(-A*RPU)}"/>`;
  s += cylX(XPU - 1.2, XPU + 1.2, MOT.y, MOT.z, MOT.rp, METAL, toneI, 1, 16);
  const ma = A * RPU / MOT.rp;
  s += ink(pd(on(PX(fx + fn[0]*.1), [[MOT.y, MOT.z], [MOT.y + 1.8*Math.cos(ma), MOT.z + 1.8*Math.sin(ma)]]), false), .9);
  return s;
}

function motor(st, A){
  let s = cylX(MOT.x0, MOT.x1, MOT.y, MOT.z, MOT.r, MOTM, toneI, 1.4, 24);
  for (let x = MOT.x0 + 3; x < MOT.x1 - 2; x += 2.6) s += line(arcUV(MOT.y, MOT.z, MOT.r + .05, 30, 200, 8).map(([y, z]) => [x, y, z]), .6);
  s += rod([XPU + 1.3, MOT.y, MOT.z], [MOT.x0, MOT.y, MOT.z], .8, METAL);
  s += box(MOT.x0 + 4, MOT.y - 2, MOT.z + MOT.r - .5, MOT.x1 - 4, MOT.y + 2, tubZ(MOT.y - CY) + .4, DARK, toneI, .9);
  return s;
}

function pump(st, t, running){
  let s = cylX(PUMP.x0, PUMP.x1, PUMP.y, PUMP.z, PUMP.r, DARK, toneI, 1.3, 20);
  s += box(PUMP.x0 + 2, PUMP.y - 3, PL, PUMP.x1 - 2, PUMP.y + 3, PUMP.z - PUMP.r + .3, DARK, toneI, .8);
  const cap = vis([1,0,0]) ? PUMP.x1 + .1 : PUMP.x0 - .1, a = running ? t*30 : 0;
  for (let j = 0; j < 4; j++){ const g = a + j*Math.PI/2; s += ink(pd(on_(cap, g)), .7); }
  return s;
  function on_(x, g){ return on(PX(x), [[PUMP.y, PUMP.z], [PUMP.y + 3*Math.cos(g), PUMP.z + 3*Math.sin(g)]]); }
}

function mechanism(st, m, k){
  const p = prog(st), t = st.tau, run = st.run, ph = run ? phaseAt(p, t) : null;
  const A = run ? angleAt(p, t) : st.restA, om = run ? omegaAt(p, t) : 0;
  const lv = run ? waterAt(p, t) : 0, heat = ph === 'wash' ? sstep(p.fill, p.fill + .8, t) * (1 - sstep(p.wash - 1, p.wash, t)) : 0;
  const sh = Math.max(0, (Math.abs(om) - 6) / 14), sway = [0, sh*1.6*Math.sin(t*41), sh*1.1*Math.sin(t*53 + 1) + (lv*-1.2)];
  const [sx, sy] = Dv(...sway);
  const hung = svg => { OX += sx; OY += sy; try { return svg(); } finally { OX -= sx; OY -= sy; } };
  const parts = [
    { at: [XPU, MOT.y - 2, MOT.z + 2], svg: hung(() => pulleyBelt(st, A)) },
    { at: [(MOT.x0 + MOT.x1)/2, MOT.y, MOT.z], svg: hung(() => motor(st, A)) },
    { at: [(XT0 + XT1)/2, CY, CZ], svg: hung(() => tubPart(st, k, sway, A, lv, heat)) },
    { at: [(PUMP.x0 + PUMP.x1)/2, PUMP.y, PUMP.z], svg: pump(st, t, ph === 'drain' || ph === 'spin') },
    { at: [34, CY - 13, H - 12], svg: hung(() => coil([34, CY - 13, tubTop(13)], [34, CY - 26, H - 3], 1.8, 8)) },
    { at: [34, CY + 13, H - 12], svg: hung(() => coil([34, CY + 13, tubTop(13)], [34, CY + 26, H - 3], 1.8, 8)) },
  ];
  return byDepth(parts);
}

/* ---------- Part Callouts (Leader Lines & Cream Pills) ---------- */
function callouts(items){
  const pts = []; for (const x of [0, W]) for (const y of [0, D]) for (const z of [0, H]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  const k = INK_K, fs = 8.6*k, hgt = fs*1.8, gap = hgt + 3*k;
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    const place = () => { let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; } };
    place();
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      const w = c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${c.text}</text></g>`;
    }
  }
  return s;
}

function surfaceLabels(st, FRONT, BACK){
  const th = ease(st.door) * DOOR_MAX, s0 = ease(st.drawer) * DRAWER_MAX, L = [];
  if (FRONT) L.push(
    { at: dP(BT, uc + RB*.72, CZ - RB*.7, th), text: 'PORTHOLE DOOR', on: st.door > 0 },
    { at: [W + .3, (DISP[0] + DISP[2])/2, (DISP[1] + DISP[3])/2], text: 'QUERY TELEMETRY', on: st.run },
    { at: [W + 1, DIAL[0], DIAL[1] + DIAL[2]], text: 'SQL STAGE DIAL', on: false },
    { at: [W + 1, BTN[0], BTN[1] + BTN[2]], text: 'START EXECUTION', on: st.run },
    { at: [W + s0, (DRW[0] + DRW[2])/2, DRW[3]], text: 'PREDICATE INGESTION', on: st.drawer > 0 },
    { at: [W + .2, 9.5, 9.75], text: 'SLUDGE PURGE TRAP', on: false });
  if (BACK) L.push(
    { at: [-4.6, 48, 83], text: 'INPUT STREAM (FROM)', on: false },
    { at: [-1.6, 12, 83.5], text: 'POWER FEED (ACID)', on: false },
    { at: [-3, 24, 30], text: 'FILTER PURGE HOSE', on: false });
  return L;
}

/* ---------- Master Scene Drawing Function ---------- */
function scene(st, m){
  const p = prog(st);
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), LEFT = facing([0,1,0]), RIGHT = facing([0,-1,0]);
  const showBasket = st.door > .02 || st.tuplesLoc === 'basket' || st.xfer;
  let s = castShadow([...on(PX(0), OUT), ...on(PX(W), OUT)]);
  if (st.door > .02){ const th = ease(st.door) * DOOR_MAX; s += castShadow(dRing(0, RB, th, 24).concat(dRing(BT, RB, th, 24))); }
  if (showBasket) s += basketShadow();

  const om = st.run ? omegaAt(p, st.tau) : 0, shake = Math.max(0, (Math.abs(om) - 8) / 12);
  const jx = shake * (.55*Math.sin(st.tau*97) + .3*Math.sin(st.tau*151)), jy = shake * (.45*Math.sin(st.tau*123 + 1));
  OX += jx; OY += jy;

  try {
    s += byDepth([[5,D-5],[5,5],[W-5,D-5],[W-5,5]].map(([x,y]) => ({ at:[x,y,0], svg: cyl(x, y, 0, PL + .5, 2.6, RUBBER, toneI, 1, 16) })));

    let body = '';
    const X = PX(W);
    if (FRONT){
      const inner = drum(st);
      body += clipTo(ringX(W, RO), st.door > .02 ? act('door', fill(pd(ringX(W, RO)), 'transparent') + inner) : inner);
      const dr = rectUV(DRW[0], DRW[1], DRW[2], DRW[3]);
      body += fill(pd(on(PX(W), dr)), '#1f1d1a');
      body += `<path d="${pd(on(X, OUT))}${pd(ringX(W, RO))}${pd(on(X, dr))}" fill="${tone([1,0,0], m)}" fill-rule="evenodd"/>`;
      body += ink(pd(ringX(W, RO)), 1.6);
      const pnl = on(PX(W + .15), rrUV(...PANEL, 4));
      body += `<path d="${pd(pnl)}${pd(on(PX(W + .15), dr))}" fill="${mix(tone([1,0,0], m), '#ffffff', .62)}" fill-rule="evenodd"/>`;
      body += ink(pd(pnl), 1.3) + ink(pd(on(PX(W + .15), dr)), 1.6);
      body += shape(on(PX(W + .15), rrUV(4.5, 7, 14.5, 12.5, 1.5)), mix(tone([1,0,0], m), '#000000', .06), 1);
      body += ink(pd(on(PX(W + .2), [[8,9.75],[11,9.75]]), false), 1);
      body += tx(W + .3, 46, 8.6, 'SQL-WASH 15', 2.6, tone([1,0,0], m) === m.d ? m.l : m.d, 800);
    }
    if (BACK) body += fill(pd(on(PX(0), OUT)), tone([-1,0,0], m)) + backFace(m);

    body += extrude(OUT, 0, W, m);
    if (LEFT){
      const sm = tone([0,1,0], m);
      body += shape(on(PY(D + .2), rrUV(12, 30, W - 12, 62, 6)), mix(sm, '#ffffff', .12), 1.2);
      const tc = mix(sm, m.d, .3);
      body += txY(W/2, D + .3, 49, 'QUERY ENGINE', 6.5, tc, 800);
      body += txY(W/2, D + .3, 40, 'RELATIONAL WASHER · ACID', 3.2, tc, 800);
      let v = ''; for (const z of [12, 16, 20]) v += pd([[14, D + .2, z], [W - 14, D + .2, z]], false);
      body += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>`;
    }
    if (RIGHT) body += sideRight(m);

    const tp = PZ(H + .1);
    body += shape(on(tp, rrUV(16, 18, 34, 44, 2)), '#fbf7ea', 1);
    for (const k of [0,1,2,3]) body += ink(pd(on(tp, [[29 - k*3.6, 22], [29 - k*3.6, k === 0 ? 40 : 35]]), false), k === 0 ? 1.1 : .7);

    if (FRONT) body += ink(pd(on(X, OUT)), 2.2);
    if (BACK) body += ink(pd(on(PX(0), OUT)), 2.2);
    body += hullInk([...on(PX(0), OUT), ...on(PX(W), OUT)], 2.8);

    let mounted = display(st) + dial(st) + startBtn(st);
    mounted += tx(W + .3, CY, PANEL[1] - 3.2, st.run ? 'LOCK (ACID)' : 'UNLOCKED', 1.9, st.run ? RED : '#6a6658', 800);
    for (const z of [CZ + 9, CZ - 13]) mounted += cyl(W + 1.6, hy + 1, z - .5, z + 4.5, 1.3, METAL, toneI, .9, 14);

    const th = ease(st.door) * DOOR_MAX, s0 = ease(st.drawer) * DRAWER_MAX;
    const parts = [
      { at: dP(BT/2, uc, CZ, th), svg: door(st) },
      showBasket && { at: basketAt(), svg: basket(st) },
      { at: [W + s0 + .7, (DRW[0]+DRW[2])/2, (DRW[1]+DRW[3])/2], svg: drawer(st) },
      st.predicateAnim != null && { at: [W + DRAWER_MAX*.5, 59, 100], svg: soapBox(st) },
      ...flying(st)
    ];
    const frontStuff = FRONT ? mounted + byDepth(parts) : byDepth(parts) + mounted;

    const k = ease(st.xr || 0);
    if (k > 0){
      const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(0), OUT), on(PX(W), OUT), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
        + (FRONT ? fill(pd(on(PX(0), OUT)), mix(m.d, '#f2efe7', .5)) : '') + (BACK ? fill(pd(on(PX(W), OUT)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
      body = far + mechanism(st, m, k) + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(0), OUT), ...on(PX(W), OUT)], 2.8) + `</g>`;
    }
    if (FRONT) s += backBits() + body + frontStuff;
    else       s += frontStuff + body + backBits();

    s += callouts(surfaceLabels(st, FRONT, BACK));
  } finally { OX -= jx; OY -= jy; }
  return s;
}

/* ---------- Interactivity & User Interface Pipeline ---------- */
let ui;
const tick = cb => ui.animate(cb);

function toggleDoor(st, ui, andThen=null){
  if (st.run) return ui.flash('engine locked while query is executing');
  st.doorT = st.doorT ? 0 : 1;
  tick(dt => {
    const g = Math.sign(st.doorT - st.door);
    st.door = Math.min(1, Math.max(0, st.door + g * dt / .4));
    if (st.door === st.doorT){ if (andThen) andThen(); return false; }
    return true;
  });
}

function swingDoor(st, target, andThen=null){
  st.doorT = target;
  tick(dt => {
    const g = Math.sign(st.doorT - st.door);
    st.door = Math.min(1, Math.max(0, st.door + g * dt / .4));
    if (st.door === st.doorT){ if (andThen) andThen(); return false; }
    return true;
  });
}

function transfer(st, dir, andThen){
  st.xfer = { dir, T:0 };
  const dur = xferEnd();
  tick(dt => {
    st.xfer.T += dt;
    if (st.xfer.T >= dur){ st.tuplesLoc = dir === 'out' ? 'basket' : 'drum'; st.xfer = null; if (andThen) andThen(); return false; }
    return true;
  });
}

function start(st, ui){
  if (st.door > 0) return ui.flash('porthole door is open — close to seal vacuum');
  if (st.tuplesLoc === 'basket' && !st.xfer) return ui.flash('basket is empty — load tuples into drum first');
  if (st.done && !st.run){ st.done = false; st.tau = 0; }
  st.run = !st.run;
  if (st.run){
    ui.flash(`Executing ${prog(st).name} Stage…`, 2000);
    const p = prog(st);
    tick(dt => {
      if (!st.run) return false;
      st.tau += dt;
      if (st.tau >= p.T){
        st.run = false; st.tau = p.T; st.done = true;
        st.restA = angleAt(p, p.T) % (2*Math.PI);
        ui.flash(`${p.name} Complete! Tuples filtered successfully.`, 3000);
        return false;
      }
      return true;
    });
  }
}

function cycleProg(st, ui){
  if (st.run) return ui.flash('query optimizer locked while running');
  st.prog = (st.prog + 1) % PROGS.length;
  st.done = false;
  ui.flash(`Stage: ${prog(st).name} · ${prog(st).desc}`);
}

function injectPredicate(st, ui){
  if (st.run) return ui.flash('machine is running — cannot inject predicate');
  if (st.predicateAnim != null) return;
  st.drawerT = 1;
  st.predicateAnim = 0;
  ui.flash('Injecting WHERE salary > 50000 predicate…', 1800);
  tick(dt => {
    if (st.drawer < 1){ st.drawer = Math.min(1, st.drawer + dt / .25); return true; }
    st.predicateAnim += dt / 1.3;
    if (st.predicateAnim >= 1){
      st.predicateAnim = null; st.predicateLvl = 1; st.drawerT = 0;
      tick(d => { st.drawer = Math.max(0, st.drawer - d / .3); return st.drawer > 0; });
      ui.flash('Predicate primed in lexical chamber!', 2000);
      return false;
    }
    return true;
  });
}

function loadTuples(st, ui){
  if (st.run) return ui.flash('engine is executing query');
  if (st.xfer) return;
  if (st.tuplesLoc === 'drum') return ui.flash('drum is already loaded with tuples');
  const go = () => { ui.flash('loading tuples into drum…', 1600); transfer(st, 'in', () => swingDoor(st, 0, () => ui.flash('tuples loaded — inject predicate, then execute', 2000))); };
  st.doorT ? go() : swingDoor(st, 1, go);
}

function toggleXray(st, ui){
  st.xrT = st.xrT ? 0 : 1;
  ui.flash(st.xrT ? 'X-Ray Internals ON: Buffer Pool, Motor & B+Tree Belt' : 'X-Ray Internals OFF');
  tick(dt => {
    const g = Math.sign(st.xrT - (st.xr || 0));
    st.xr = Math.min(1, Math.max(0, (st.xr || 0) + g * dt / .35));
    return st.xr !== st.xrT;
  });
}

/* ---------- Mount Colorfigures Machine ---------- */
ui = mountFigure({
  fig:'15', title:'SQL Relational Washer & Execution Engine',
  hint:'load tuples, inject predicate, choose query stage, run cycle — then unload to basket',
  idea:"Physical relational query execution: the WHERE predicate centrifuges non-matching rows out through the drum perforations, while matching tuples emerge clean into the output basket.",
  size:[W, D, H], palette:'mint',
  state:{
    prog:0, run:false, paused:false, tau:0, done:false,
    door:0, doorT:0, drawer:0, drawerT:0, restA:0,
    predicateLvl:0, predicateAnim:null, tuplesLoc:'basket', xfer:null, xr:0, xrT:0
  },
  scene,
  readout: st => {
    const p = prog(st);
    if (st.run){
      const ph = { fill:'parsing query', wash:'evaluating predicates', drain:'purging false tuples', spin:'centrifuging valid rows' }[phaseAt(p, st.tau)];
      return `${p.name} · ${ph} · ${fmt(remaining(st))} left`;
    }
    if (st.tuplesLoc === 'basket' && !st.xfer) return st.door > 0 ? 'tuples waiting in the basket — load into drum to begin' : 'ready — load employee tuples from basket';
    if (st.door > 0) return 'door open — click porthole to close and seal';
    if (st.done) return 'query execution complete — unload 3 filtered tuples to basket';
    return `${p.name} · ${p.desc} — click dial to change stage, execute to run`;
  },
  buttons:[
    { label:'🧺 Load Tuples (FROM)', onClick:(st,ui) => loadTuples(st,ui) },
    { label:'🧪 Inject Predicate (WHERE)', onClick:(st,ui) => injectPredicate(st,ui) },
    { label:'⚙️ Query Stage', choices: st => PROGS.map((p,i) => ({ label:`${p.name}: ${p.desc}`, current: st.prog === i, disabled: st.run, why: 'engine locked while executing',
        onClick:(st,ui) => { if (st.run) return ui.flash('engine locked while running'); st.prog = i; st.done = false; } })) },
    { label:'▶ Run Query Execution', onClick:(st,ui) => start(st,ui) },
    { label:'🔬 Toggle X-Ray Internals', onClick:(st,ui) => toggleXray(st,ui) },
    { label:'🧺 Unload Results (SELECT)', onClick:(st,ui) => {
        if (!st.doorT) return toggleDoor(st, ui, true);
        if (st.xfer) return;
        if (st.tuplesLoc === 'drum'){ ui.flash('unloading clean results to basket…', 1600); transfer(st, 'out', () => ui.flash('clean tuples landed in result basket', 1800)); }
        else ui.flash('drum is already empty'); } },
    { label:'🚪 Toggle Door', onClick:(st,ui) => toggleDoor(st,ui) },
  ],
  buttonsLabel:'Query Controls',
  acts:{
    dial:(st,el,ui) => cycleProg(st,ui),
    start:(st,el,ui) => start(st,ui),
    door:(st,el,ui) => toggleDoor(st,ui),
    drawer:(st,el,ui) => { st.drawerT = st.drawerT ? 0 : 1; tick(dt => { const g = Math.sign(st.drawerT - st.drawer); st.drawer = Math.min(1, Math.max(0, st.drawer + g * dt / .4)); return st.drawer !== st.drawerT; }); }
  }
});
</script>
